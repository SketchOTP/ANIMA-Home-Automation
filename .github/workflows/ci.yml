name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.7"
      - name: Run deterministic validation
        run: ./scripts/validate.sh
      - name: Run Phase 13 SENTRY boundary validation
        run: |
          set -euo pipefail
          uv run --locked pytest -q tests/test_sentry_boundary_hardening.py tests/test_senseguard_alerts.py
          uv run --locked mypy src tests
          python -m compileall -q integrations/sentry/anima-household
          if rg -n 'ANIMA_(DATABASE_URL|HA_ACCESS_TOKEN|HA_WEBSOCKET_URL|OPA_URL)' integrations/sentry/anima-household integrations/sentry/anima-core; then
            echo 'SENTRY bundle contains ANIMA-owned credentials.' >&2
            exit 1
          fi
      - name: Run actual MCP runtime certification
        run: uv run --locked python scripts/verify_phase13_mcp_runtime.py
      - name: Run Phase 14 deterministic resilience contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/anima-p14-evidence
          uv run --locked python scripts/verify_phase14_resilience.py \
            --output /tmp/anima-p14-evidence/phase14-resilience.json \
            | tee /tmp/anima-p14-evidence/phase14-resilience.stdout.json

      - name: Start Core services for integrated UI validation
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          docker compose up -d db opa searxng
          db_id="$(docker compose ps -q db)"
          opa_id="$(docker compose ps -q opa)"
          for attempt in {1..30}; do
            db_health="$(docker inspect --format '{{.State.Health.Status}}' "$db_id" 2>/dev/null || true)"
            opa_health="$(docker inspect --format '{{.State.Health.Status}}' "$opa_id" 2>/dev/null || true)"
            if [[ "$db_health" == "healthy" && "$opa_health" == "healthy" ]] \
              && docker compose exec -T db pg_isready -U anima -d anima >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:18181/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose ps
              docker compose logs --no-color db opa
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U anima -d anima
          curl --fail --silent http://127.0.0.1:18181/health >/dev/null
          uv run --locked --group dev anima-migrate
      - name: Run Phase 14 R2 real-store qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_r2.py \
            --output /tmp/anima-p14-evidence/phase14-r2-real-store.json \
            | tee /tmp/anima-p14-evidence/phase14-r2-real-store.stdout.json
      - name: Run Phase 14 actual backup and restore qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_backup_restore_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-backup-restore-r2.json
      - name: Run Phase 14 approval ownership race
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_approval_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-approval-race.json
      - name: Run Phase 14 approval continuation process-crash qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_approval_crash_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-approval-crash-r2.json
      - name: Run Phase 14 external failure and isolation qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_external_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-external-r2.json
      - name: Run Phase 14 external-content attack qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_external_attack_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-external-attack-r2.json
      - name: Run Phase 14 PostgreSQL and OPA restart continuity
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_service_restart_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-service-restart-r2.json
      - name: Run Phase 14 action recovery qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_action_recovery_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-action-recovery-r2.json
      - name: Run Phase 14 continuation fencing qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_continuation_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-continuation-r2.json
      - name: Run Phase 14 event replay and plugin isolation qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_events_plugins_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-events-plugins-r2.json
      - name: Run Phase 14 clean-store replay qualification
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_clean_replay_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-clean-replay-r2.json
      - name: Run Phase 14 SENTRY bridge restart qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_bridge_restart_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-bridge-restart-r2.json
      - name: Run Phase 14 SENTRY provider crash qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_provider_crash_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-provider-crash-r2.json
      - name: Run Phase 14 SENTRY outage and local-platform continuity qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_outage_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-outage-r2.json
      - name: Run Phase 14 isolated HA outage qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_ha_outage_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-ha-outage-r2.json
      - name: Run Phase 14 real Phase 9 concurrency qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase9_action_execution.py \
            | tee /tmp/anima-p14-evidence/phase14-phase9-concurrency.stdout.txt
      - name: Run Phase 14 OPA outage fail-closed qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_opa_outage_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-opa-outage-r2.json
      - name: Run Phase 12 H5 evidence targets
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          mkdir -p /tmp/anima-h5-evidence
          printf '{"tested_sha":"%s"}\n' "$(git rev-parse HEAD)" > /tmp/anima-h5-evidence/metadata.json
          uv run --locked python scripts/verify_phase12_h4_core.py | tee /tmp/anima-h5-evidence/phase12-h4-core.json
          uv run --locked python scripts/verify_phase12_h5_core.py | tee /tmp/anima-h5-evidence/phase12-h5-core.json
          uv run --locked python scripts/verify_phase12_h5u_confirmation.py | tee /tmp/anima-h5-evidence/phase12-h5u-confirmation.json
          uv run --locked python scripts/verify_phase12_h5v_true_resume.py | tee /tmp/anima-h5-evidence/phase12-h5v-true-resume.json
          uv run --locked python scripts/verify_phase12_h4_isolated_ha.py | tee /tmp/anima-h5-evidence/phase12-isolated-ha.json
          uv run --locked python scripts/verify_phase11_restricted_content.py | tee /tmp/anima-h5-evidence/phase11-restricted-content.json
          uv build --sdist --wheel
          git diff --check
      - name: Run public repository safety scan
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.(pem|key|p12|sqlite3?|log))$'; then
            echo 'Potential secret or runtime artifact is tracked.' >&2
            exit 1
          fi
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}' -- .; then
            echo 'Potential credential material found in tracked content.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 UI image
        run: docker buildx build --platform linux/arm64 -f Dockerfile.ui -t anima-ui:phase14-arm64 --load .
      - name: Run ARM64 runtime smoke
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --entrypoint python \
            anima-ui:phase14-arm64 \
            -c 'import anima_ha; print("ANIMA_ARM64_RUNTIME_IMPORT_PASS")'
          docker run --rm --platform linux/arm64 --entrypoint python \
            -v "$GITHUB_WORKSPACE/scripts/verify_phase14_resilience.py:/tmp/verify_phase14_resilience.py:ro" \
            anima-ui:phase14-arm64 \
            /tmp/verify_phase14_resilience.py \
            --output /tmp/anima-arm64-replay.json \
            | grep -q 'DETERMINISTIC_CONTRACT'
          echo 'ANIMA_ARM64_REPLAY_CONTRACT_PASS'
      - name: Build and health-check UI container
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_UI_PORT: 18091
        run: |
          set -euo pipefail
          docker compose build ui
          docker compose up -d ui
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18091/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color ui
          curl --fail --silent http://127.0.0.1:18091/healthz >/dev/null
      - name: Run Phase 14 process restart matrix
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
          ANIMA_UI_PORT: 18091
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_process_matrix_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-process-matrix-r2.json
      - name: Run Phase 14 in-flight PostgreSQL restart qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_inflight_restart_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-inflight-restart-r2.json
      - name: Stop UI after process restart matrix
        if: always()
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
        run: docker compose stop ui
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Run local interface validation
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
          npx playwright install --with-deps chromium webkit
          npm run e2e -- --reporter=html,line
          ./node_modules/.bin/playwright test -c playwright.h5v.config.ts --reporter=html,line
          cd ..
          uv run --locked python scripts/verify_phase12_h5v_ledger.py | tee /tmp/anima-h5-evidence/phase12-h5v-ledger.json
      - name: Publish Phase 12 H5 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-h5-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/anima-h5-evidence/
            /tmp/anima-p14-evidence/
            ui/playwright-report/
            ui/test-results/
      - name: Stop Core services
        if: always()
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
        run: docker compose down --remove-orphans
