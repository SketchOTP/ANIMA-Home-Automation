      - name: Run Phase 14 consolidated residual closure bundle
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_closure_bundle_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-closure-bundle-r2.json
      - name: Run Phase 14 external failure and isolation qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_external_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-external-r2.json
      - name: Run Phase 14 external-content attack qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_external_attack_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-external-attack-r2.json
      - name: Run Phase 14 PostgreSQL and OPA restart continuity
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_service_restart_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-service-restart-r2.json
      - name: Run Phase 14 action recovery qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_action_recovery_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-action-recovery-r2.json
      - name: Run Phase 14 continuation fencing qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_continuation_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-continuation-r2.json
      - name: Run Phase 14 event replay and plugin isolation qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_events_plugins_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-events-plugins-r2.json
      - name: Run Phase 14 out-of-process plugin restart qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_plugin_process_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-plugin-process-r2.json
      - name: Run Phase 14 clean-store replay qualification
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_clean_replay_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-clean-replay-r2.json
      - name: Run Phase 14 SENTRY bridge restart qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_bridge_restart_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-bridge-restart-r2.json
      - name: Run Phase 14 SENTRY provider crash qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_provider_crash_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-provider-crash-r2.json
      - name: Run Phase 14 SENTRY process lifecycle matrix
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_process_matrix_r3.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-process-matrix-r3.json
      - name: Run Phase 14 SENTRY outage and local-platform continuity qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_sentry_outage_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-sentry-outage-r2.json
      - name: Run Phase 14 isolated HA outage qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_ha_outage_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-ha-outage-r2.json
      - name: Run Phase 14 isolated HA ambiguous-dispatch qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
