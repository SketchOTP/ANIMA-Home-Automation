          done
          (cd ui && ./node_modules/.bin/playwright test -c playwright.stage8.config.ts \
            --reporter=line,junit --output=/tmp/anima-owner-evidence/stage8-browser)
          .venv/bin/python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/anima-owner-evidence/stage8-browser.xml").getroot(); assert sum(int(s.get("tests","0")) for s in r.iter("testsuite"))==2; assert all(int(s.get(k,"0"))==0 for s in r.iter("testsuite") for k in ("skipped","failures","errors"))'
      - name: Publish Phase 12 H5 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-h5-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/anima-h5-evidence/
            /tmp/anima-p14-evidence/
            /tmp/anima-owner-evidence/
            ui/playwright-report/
            ui/test-results/
      - name: Stop Core services
        if: always()
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
        run: docker compose down --remove-orphans
