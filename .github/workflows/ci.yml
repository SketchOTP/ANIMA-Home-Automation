          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_inflight_restart_r2.py \
