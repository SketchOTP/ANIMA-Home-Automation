name: anima-ha

services:
  db:
    image: pgvector/pgvector:pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${ANIMA_DB_NAME:-anima}
      POSTGRES_USER: ${ANIMA_DB_USER:-anima}
      POSTGRES_PASSWORD: ${ANIMA_DB_PASSWORD:?set ANIMA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ANIMA_DB_PORT:-55432}:5432"
    volumes:
      - anima_ha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.20.1@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "/policies"]
    ports:
      - "127.0.0.1:${ANIMA_OPA_PORT:-18181}:8181"
    volumes:
      - ./policy/phase4:/policies:ro
    healthcheck:
      test: ["CMD", "opa", "check", "/policies"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:2026.8.29-d226b78bc@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_IMAGE_PROXY: "false"
      SEARXNG_LIMITER: "false"
      SEARXNG_PORT: 8080
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${ANIMA_SEARXNG_PORT:-18888}:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/search?q=health&format=json", timeout=3)'
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      ANIMA_ENV: ${ANIMA_ENV:-development}
      ANIMA_DATABASE_URL: postgresql://${ANIMA_DB_USER:-anima}:${ANIMA_DB_PASSWORD:?set ANIMA_DB_PASSWORD in .env}@db:5432/${ANIMA_DB_NAME:-anima}
      ANIMA_UI_BIND: 0.0.0.0
      ANIMA_UI_PORT: 8090
      ANIMA_UI_STATIC_DIR: /app/ui/dist
      ANIMA_OPA_URL: http://opa:8181
      ANIMA_SEARXNG_URL: http://searxng:8080
      ANIMA_SEARXNG_HOST: searxng
      ANIMA_OVERPASS_URL: https://overpass-api.de
      ANIMA_HA_BASE_URL: ${ANIMA_HA_BASE_URL:-}
      ANIMA_HA_OAUTH_CLIENT_ID: ${ANIMA_HA_OAUTH_CLIENT_ID:-}
      ANIMA_HA_OAUTH_REDIRECT_URI: ${ANIMA_HA_OAUTH_REDIRECT_URI:-}
      ANIMA_HA_INSTANCE_ID: ${ANIMA_HA_INSTANCE_ID:-}
      ANIMA_HA_PROVIDER_SCOPE: ${ANIMA_HA_PROVIDER_SCOPE:-}
      ANIMA_HA_WEBSOCKET_URL: ${ANIMA_HA_WEBSOCKET_URL:-}
      ANIMA_HA_TOKEN_SECRET_NAME: ${ANIMA_HA_TOKEN_SECRET_NAME:-HA_ACCESS_TOKEN}
      HA_ACCESS_TOKEN: ${HA_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:${ANIMA_UI_PORT:-18090}:8090"
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  anima_ha_postgres_data:
