name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Architect must pin the published accepted Stage8 SENTRY commit before
      # publication. Never substitute mutable main or the pre-Stage8 baseline.
      SENTRY_STAGE8_QUALIFICATION_REF: b331c058aae4b33bfd5db0a3420855f09142acff
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.7"
      - name: Run deterministic validation
        run: ./scripts/validate.sh
      - name: Run Phase 13 SENTRY boundary validation
        run: |
          set -euo pipefail
          uv run --locked pytest -q tests/test_sentry_boundary_hardening.py tests/test_senseguard_alerts.py
          uv run --locked mypy src tests
          python -m compileall -q integrations/sentry/anima-household
          # Negative environment-isolation tests deliberately name forbidden inputs.
          if rg -n --glob '!test_*.py' 'ANIMA_(DATABASE_URL|HA_ACCESS_TOKEN|HA_WEBSOCKET_URL|OPA_URL)' integrations/sentry/anima-household integrations/sentry/anima-core; then
            echo 'SENTRY bundle contains ANIMA-owned credentials.' >&2
            exit 1
          fi
          mkdir -p /tmp/anima-owner-evidence
          uv run --locked pytest -q integrations/sentry/anima-household/test_household_worker.py --junitxml=/tmp/anima-owner-evidence/worker.xml
          uv run --locked pytest -q tests/test_ha_connection_setup.py tests/test_owner_boundary.py --junitxml=/tmp/anima-owner-evidence/owner-connection.xml
          printf '{"tested_sha":"%s","evidence_level":"DETERMINISTIC_CONTRACT"}\n' "${GITHUB_SHA}" > /tmp/anima-owner-evidence/metadata.json
      - name: Run actual MCP runtime certification
        run: uv run --locked python scripts/verify_phase13_mcp_runtime.py
      - name: Run Phase 14 deterministic resilience contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/anima-p14-evidence
          uv run --locked python scripts/verify_phase14_resilience.py \
            --output /tmp/anima-p14-evidence/phase14-resilience.json \
            | tee /tmp/anima-p14-evidence/phase14-resilience.stdout.json

      - name: Start Core services for integrated UI validation
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          docker compose up -d db opa searxng
          db_id="$(docker compose ps -q db)"
          opa_id="$(docker compose ps -q opa)"
          for attempt in {1..30}; do
            db_health="$(docker inspect --format '{{.State.Health.Status}}' "$db_id" 2>/dev/null || true)"
            opa_health="$(docker inspect --format '{{.State.Health.Status}}' "$opa_id" 2>/dev/null || true)"
            if [[ "$db_health" == "healthy" && "$opa_health" == "healthy" ]] \
              && docker compose exec -T db pg_isready -U anima -d anima >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:18181/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose ps
              docker compose logs --no-color db opa
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U anima -d anima
          curl --fail --silent http://127.0.0.1:18181/health >/dev/null
          uv run --locked --group dev anima-migrate
      - name: Validate immutable Stage8 second-source custody
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SENTRY_STAGE8_QUALIFICATION_REF"]), "Architect must pin the accepted immutable Stage8 SENTRY commit"'
      - name: Check out accepted immutable Stage8 SENTRY qualification source
        uses: actions/checkout@v5
        with:
          repository: SketchOTP/SENTRY
          ref: ${{ env.SENTRY_STAGE8_QUALIFICATION_REF }}
          path: .stage8-sentry-source
          persist-credentials: false
      - name: Qualify Stage2–9 delivery, owner workflows, audio and learning against isolated PostgreSQL
        env:
          PYTHONPATH: src
          ANIMA_DB_PASSWORD: anima_dev_only
          SEARXNG_SECRET: ci-only-placeholder
          ANIMA_STAGE2_TEST_DATABASE_URL: postgresql://stage2:stage2-test-only@127.0.0.1:55432/anima_vendor_ingress_test
          ANIMA_VENDOR_TEST_DATABASE_URL: postgresql://stage2:stage2-test-only@127.0.0.1:55432/anima_vendor_ingress_test
          ANIMA_STAGE3_TEST_OPA_URL: http://127.0.0.1:18181
          ANIMA_INTELLIGENCE_PROVIDER: sentry
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U anima -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE stage2 LOGIN PASSWORD 'stage2-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          docker compose exec -T db createdb -U anima -O stage2 anima_vendor_ingress_test
          mkdir -p /tmp/anima-owner-evidence
          task_isolation="$(mktemp -d /tmp/anima-stage5-ci-pg.XXXXXX)"
          export SENTRY_AUTHORITY_ROOT="$task_isolation/authority"
          export SENTRY_AGENT_WORKSPACE="$task_isolation/workspace"
          export XDG_STATE_HOME="$task_isolation/state" CODEX_HOME="$task_isolation/codex"
          unset SENTRY_CODEX_HOME
          uv run --locked pytest -q tests/test_stage2_delivery_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage2-delivery-postgres.xml
          uv run --locked pytest -q tests/test_vendor_event_ingress.py \
            --junitxml=/tmp/anima-owner-evidence/stage2-vendor-ingress.xml
          uv run --locked pytest -q tests/test_stage3_household_situation.py tests/test_stage3_core_composition.py \
            --junitxml=/tmp/anima-owner-evidence/stage3-context-composition.xml
          uv run --locked pytest -q tests/test_stage4_learning_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage4-learning-postgres.xml
          uv run --locked pytest -q tests/test_stage5_owner_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage5-owner-postgres.xml
          uv run --locked pytest -q tests/test_stage6_owner_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage6-owner-postgres.xml
          uv run --locked pytest -q tests/test_stage7_learning_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage7-learning-postgres.xml
          uv run --locked pytest -q tests/test_stage9_audio_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage9-audio-postgres.xml
          .venv/bin/python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/anima-owner-evidence/stage9-audio-postgres.xml").getroot(); assert sum(int(s.get("tests","0")) for s in r.iter("testsuite"))==5; assert all(int(s.get(k,"0"))==0 for s in r.iter("testsuite") for k in ("skipped","failures","errors"))'
          export SENTRY_STAGE8_QUALIFICATION_SOURCE="$GITHUB_WORKSPACE/.stage8-sentry-source"
          test "$(git -C "$SENTRY_STAGE8_QUALIFICATION_SOURCE" rev-parse HEAD)" = "$SENTRY_STAGE8_QUALIFICATION_REF"
          .venv/bin/python -c 'import anima_ha,os; from pathlib import Path; assert Path(str(anima_ha.__file__)).resolve().is_relative_to(Path.cwd()/"src"); print(anima_ha.__file__, os.environ["SENTRY_STAGE8_QUALIFICATION_SOURCE"])' \
            > /tmp/anima-owner-evidence/stage8-source-binding.txt
          printf '%s\n' "$SENTRY_STAGE8_QUALIFICATION_REF" > /tmp/anima-owner-evidence/stage8-sentry-commit.txt
          uv run --locked pytest -q tests/test_stage8_owner_postgres.py \
            tests/test_stage8_task_result_postgres.py tests/test_stage8_approval_postgres.py \
            tests/test_stage8_delivery_postgres.py tests/test_stage8_resident_task_postgres.py \
            tests/test_stage8_privacy_postgres.py \
            --junitxml=/tmp/anima-owner-evidence/stage8-owner-results-postgres.xml
          .venv/bin/python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/anima-owner-evidence/stage8-owner-results-postgres.xml").getroot(); assert all(int(s.get(k,"0"))==0 for s in r.iter("testsuite") for k in ("skipped","failures","errors")), "Stage8 target qualification cannot skip"'
      - name: Qualify late device entities against isolated PostgreSQL
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_LATE_BINDING_TEST_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima_late_binding_test
          SEARXNG_SECRET: ci-only-placeholder
        run: |
          set -euo pipefail
          docker compose exec -T db createdb -U anima anima_late_binding_test
          uv run --locked pytest -q tests/test_home_assistant_late_binding_postgres.py tests/test_ui_runtime_event_routing.py \
            --junitxml=/tmp/anima-owner-evidence/late-binding-postgres.xml
      - name: Run Phase 14 R2 real-store qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_r2.py \
            --output /tmp/anima-p14-evidence/phase14-r2-real-store.json \
            | tee /tmp/anima-p14-evidence/phase14-r2-real-store.stdout.json
      - name: Run Phase 14 actual backup and restore qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_backup_restore_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-backup-restore-r2.json
      - name: Run Phase 14 approval ownership race
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_approval_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-approval-race.json
      - name: Run Phase 14 approval continuation process-crash qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_approval_crash_r2.py \
            | tee /tmp/anima-p14-evidence/phase14-approval-crash-r2.json
      - name: Run Phase 14 durable continuation result qualification
        env:
          ANIMA_DB_PASSWORD: anima_dev_only
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
        run: |
          set -euo pipefail
          uv run --locked python scripts/verify_phase14_approval_durable_r3.py \
            | tee /tmp/anima-p14-evidence/phase14-approval-durable-r3.json
      - name: Run Phase 14 policy reauthorization qualification
        env:
