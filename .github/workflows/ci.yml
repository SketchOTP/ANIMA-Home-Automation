          SEARXNG_SECRET: ci-only-placeholder
        run: docker compose stop ui
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Run local interface validation
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
          npx playwright install --with-deps chromium webkit
          npm run e2e -- --reporter=html,line
          ./node_modules/.bin/playwright test -c playwright.h5v.config.ts --reporter=html,line
          cd ..
          uv run --locked python scripts/verify_phase12_h5v_ledger.py | tee /tmp/anima-h5-evidence/phase12-h5v-ledger.json
      - name: Run owner product browser qualification
        env:
          ANIMA_DATABASE_URL: postgresql://anima:anima_dev_only@127.0.0.1:55432/anima
          ANIMA_OPA_URL: http://127.0.0.1:18181
        run: uv run --locked python scripts/verify_owner_product_browser.py
      - name: Qualify Stage5 owner workflows on desktop and phone
        env:
          PYTHONPATH: src
          ANIMA_STAGE2_TEST_DATABASE_URL: postgresql://stage2:stage2-test-only@127.0.0.1:55432/anima_vendor_ingress_test
          ANIMA_STAGE3_TEST_OPA_URL: http://127.0.0.1:18181
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: /tmp/anima-owner-evidence/stage5-browser.xml
        run: |
          set -euo pipefail
          mkdir -p /tmp/anima-owner-evidence
          task_isolation="$(mktemp -d /tmp/anima-stage5-ci-browser.XXXXXX)"
          export SENTRY_AUTHORITY_ROOT="$task_isolation/authority"
          export SENTRY_AGENT_WORKSPACE="$task_isolation/workspace"
          export XDG_STATE_HOME="$task_isolation/state" CODEX_HOME="$task_isolation/codex"
          unset SENTRY_CODEX_HOME
          .venv/bin/python -c 'import anima_ha; print(anima_ha.__file__); import socket; probe=socket.socket(); probe.bind(("127.0.0.1",18335)); probe.close()'
          .venv/bin/python tests/serve_stage5_owner_workflows.py \
            > /tmp/anima-owner-evidence/stage5-browser-fixture.log 2>&1 &
          fixture_pid=$!
          cleanup() {
            fixture_status=$?
            trap - EXIT
            kill -TERM "$fixture_pid" 2>/dev/null || true
            for attempt in {1..10}; do
              if ! kill -0 "$fixture_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            kill -KILL "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
            exit "$fixture_status"
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              echo 'Stage5 guarded fixture exited before readiness.' >&2
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18335/healthz >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 1
          done
          (cd ui && ./node_modules/.bin/playwright test -c playwright.stage5.config.ts \
            --reporter=line,junit --output=/tmp/anima-owner-evidence/stage5-browser)
      - name: Qualify Stage6 supported setup and scene workflow on desktop and phone
