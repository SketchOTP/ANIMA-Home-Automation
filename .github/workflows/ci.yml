name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.7"
      - name: Run deterministic validation
        run: ./scripts/validate.sh
