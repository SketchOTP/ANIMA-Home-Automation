      - name: Qualify Stage8 mounted owner task and originating results on desktop and phone
        env:
          PYTHONPATH: src
          ANIMA_STAGE2_TEST_DATABASE_URL: postgresql://stage2:stage2-test-only@127.0.0.1:55432/anima_vendor_ingress_test
          ANIMA_STAGE3_TEST_OPA_URL: http://127.0.0.1:18181
          ANIMA_INTELLIGENCE_PROVIDER: sentry
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: /tmp/anima-owner-evidence/stage8-browser.xml
        run: |
          set -euo pipefail
          mkdir -p /tmp/anima-owner-evidence
          task_isolation="$(mktemp -d /tmp/anima-stage8-ci-browser.XXXXXX)"
          export SENTRY_AUTHORITY_ROOT="$task_isolation/authority"
          export SENTRY_AGENT_WORKSPACE="$task_isolation/workspace"
          export XDG_STATE_HOME="$task_isolation/state" CODEX_HOME="$task_isolation/codex"
          export XDG_CONFIG_HOME="$task_isolation/config"
          unset SENTRY_CODEX_HOME
          .venv/bin/python -c 'import anima_ha; from pathlib import Path; assert Path(str(anima_ha.__file__)).resolve().is_relative_to(Path.cwd()/"src"); import socket; p=socket.socket(); p.bind(("127.0.0.1",18338)); p.close()'
          .venv/bin/python tests/serve_stage8_owner_results.py \
            > /tmp/anima-owner-evidence/stage8-browser-fixture.log 2>&1 &
          fixture_pid=$!
          cleanup() {
            fixture_status=$?
            trap - EXIT
            kill -TERM "$fixture_pid" 2>/dev/null || true
            for attempt in {1..10}; do
              if ! kill -0 "$fixture_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$fixture_pid" 2>/dev/null; then kill -KILL "$fixture_pid"; fi
            wait "$fixture_pid" 2>/dev/null || true
            exit "$fixture_status"
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            if curl --fail --silent http://127.0.0.1:18338/healthz >/dev/null; then break; fi
